<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn a question</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.8.0/distrib/jsxgraph.css">
<script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.8.0/distrib/jsxgraphcore.js"></script>
<script src="/static/scene.js" onerror="window.__sceneJsMissing = true"></script>
<style>
  :root {
    --primary: #1a365d; --accent: #2b6cb0; --success: #276749; --warning: #c05621; --danger: #c53030;
    --bg: #f7fafc; --card: #ffffff; --border: #e2e8f0; --text: #2d3748; --muted: #718096; --mark: #805ad5;
    --hint-bg: #f0fff4; --warn-bg: #fffaf0; --user-bg: #ebf4ff; --ok-bg: #f0fff4; --miss-bg: #fffaf0; --code-bg: #edf2f7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #90cdf4; --accent: #63b3ed; --success: #68d391; --warning: #f6ad55; --danger: #fc8181;
      --bg: #171923; --card: #1f2330; --border: #2d3748; --text: #e2e8f0; --muted: #a0aec0; --mark: #b794f4;
      --hint-bg: #1c2e25; --warn-bg: #2e2518; --user-bg: #1e2a3d; --ok-bg: #1c2e25; --miss-bg: #2e2518; --code-bg: #2a2f3d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--primary); color: #fff; padding: 12px 16px;
           display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) header { background: #102a43; } }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header h1 span { font-weight: 400; opacity: .8; }
  header h1 a { color: inherit; text-decoration: none; }
  header nav { display: flex; flex-wrap: wrap; gap: 0 6px; margin: 0 -8px; }
  header nav a { color: #fff; opacity: .85; font-size: 14px; margin: 0; padding: 10px 8px; min-height: 40px; box-sizing: border-box; display: inline-flex; align-items: center; }
  main { max-width: 900px; margin: 0 auto; padding: 16px 16px 40px; }
  a { color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin: 12px 0; }
  .card h3 { margin: 0 0 8px; font-size: 16px; color: var(--primary); }
  .card h3 small { color: var(--muted); font-weight: 400; font-size: 13px; }
  .question { border-left: 4px solid var(--accent); }
  .pre { white-space: pre-wrap; overflow-x: auto; }
  .pre.stem { margin-bottom: 8px; }
  .muted { color: var(--muted); }
  .hint { color: var(--muted); font-size: 14px; margin: 4px 0 8px; }
  .warning { background: var(--warn-bg); border: 1px solid var(--warning); border-radius: 8px; padding: 10px 14px; margin: 12px 0; }
  h2.comp { font-size: 15px; text-transform: capitalize; color: var(--muted); margin: 22px 0 6px; letter-spacing: .02em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .tile { display: block; text-decoration: none; color: inherit; background: var(--card); border: 1px solid var(--border);
          border-radius: 10px; padding: 12px 14px; transition: border-color .15s; }
  .tile:hover { border-color: var(--accent); }
  .tile b { color: var(--primary); display: block; margin-bottom: 4px; font-size: 15px; }
  .tile .meta { color: var(--muted); font-size: 13px; }
  .badge { display: inline-block; font-size: 11.5px; border-radius: 10px; padding: 1px 8px; margin-left: 6px; vertical-align: middle;
           border: 1px solid var(--border); color: var(--muted); font-weight: 600; }
  .badge.levels { border-color: var(--success); color: var(--success); }
  .badge.interactive { border-color: var(--mark); color: var(--mark); }
  .badge.tier { text-transform: capitalize; }
  .chip { display: inline-block; color: #fff; border-radius: 12px; font-size: 12.5px; padding: 2px 10px; min-width: 44px;
          text-align: center; font-weight: 600; background: var(--mark); margin: 2px 4px 2px 0; white-space: nowrap; }
  .chip.none { background: transparent; color: var(--muted); border: 1px dashed var(--border); }
  .chip.err { background: var(--warning); min-width: 0; font-weight: 500; }
  .chip.skill { background: var(--code-bg); color: var(--text); font-weight: 500; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--border); margin: 18px 0 0; }
  .tabs button { min-height: 44px; white-space: nowrap; }
  .hint a.back { display: inline-block; padding: 8px 0; }
  .tabs button { background: transparent; border: 0; border-bottom: 3px solid transparent; color: var(--muted); font: inherit;
                 font-size: 15px; padding: 8px 12px; cursor: pointer; margin-bottom: -1px; }
  .tabs button.on { color: var(--primary); border-bottom-color: var(--accent); font-weight: 600; }
  .tabs button:focus-visible { outline: 2px solid var(--accent); border-radius: 4px; }
  .panel { display: none; }
  .panel.on { display: block; }
  .depth { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 6px; }
  .depth button { font: inherit; font-size: 14px; border-radius: 20px; padding: 6px 14px; min-height: 40px; cursor: pointer;
                  border: 1px solid var(--accent); background: var(--card); color: var(--accent); }
  .depth button.on { background: var(--accent); color: #fff; }
  .depth button:disabled { opacity: .45; cursor: default; border-color: var(--border); color: var(--muted); }
  .depth button:disabled small { font-weight: 400; opacity: .9; }
  .depth .walk { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text); cursor: pointer;
                 margin-left: auto; padding: 6px 4px; min-height: 40px; user-select: none; }
  .depth .walk input { accent-color: var(--accent); width: 20px; height: 20px; margin: 0; }
  .depth .walk.off { opacity: .5; cursor: default; }
  .walkbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 4px; }
  .walkbar .progress { color: var(--muted); font-size: 14px; margin-right: auto; }
  .walkbar button, .done button { font: inherit; font-size: 14px; border-radius: 20px; padding: 6px 14px; min-height: 40px; cursor: pointer;
                  border: 1px solid var(--accent); background: var(--card); color: var(--accent); }
  .walkbar button.primary, .done button { background: var(--accent); color: #fff; }
  .walkbar button:focus-visible, .done button:focus-visible, .whyd summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .walkbar .keys { color: var(--muted); font-size: 12.5px; flex-basis: 100%; }
  .line.fresh { border-color: var(--accent); }
  .whyd { margin-top: 4px; }
  .whyd summary { cursor: pointer; color: var(--accent); font-size: 14px; list-style: none; display: inline-block; padding: 8px 0; }
  .whyd summary::-webkit-details-marker { display: none; }
  .whyd summary::before { content: "▸ "; }
  .whyd[open] summary::before { content: "▾ "; }
  .whyd .why { margin-top: 2px; }
  .done { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .partname { font-size: 14px; color: var(--muted); margin: 14px 0 4px; }
  .partname b { color: var(--text); }
  .line { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start;
          border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
  .line .work { min-width: 0; overflow-x: auto; }
  .line .n { color: var(--muted); font-size: 12.5px; margin-right: 6px; }
  .line .why { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .line .check { color: var(--success); font-size: 14px; margin-top: 4px; }
  .line .check b { font-weight: 600; }
  .line .codes { text-align: right; }
  .row { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start;
         border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
  .row .for { min-width: 0; overflow-x: auto; }
  .row .for .scheme { font-weight: 600; }
  .notes { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .conv { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .conv b { color: var(--text); font-weight: 600; }
  .pit { border-left: 4px solid var(--warning); background: var(--warn-bg); border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
  .pit .def { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .hints { background: var(--hint-bg); border-left: 4px solid var(--success); border-radius: 8px; padding: 8px 12px; margin: 8px 0; font-size: 14.5px; }
  .hints b { color: var(--success); }
  .scene { margin: 12px 0; }
  .scene h4 { margin: 0 0 4px; font-size: 15px; color: var(--primary); }
  .scene .purpose { color: var(--muted); font-size: 14px; margin-bottom: 4px; }
  .scene .approach { color: var(--text); font-size: 14px; font-style: italic; margin-bottom: 10px; }
  .scene .scene-note { color: var(--muted); font-size: 14px; margin-top: 8px; }
  /* scene.js fills the host with a slider row, its own 320-420px board and the steps UI; the min-height keeps the
     layout steady before the lazy render and lets the visibility check see a sized box */
  .scene-host { width: 100%; min-height: 380px; }
  .scene-host .jxgbox { width: 100%; }
  .practise { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .practise a.act { background: var(--accent); color: #fff; border-radius: 20px; padding: 8px 18px; min-height: 40px; box-sizing: border-box; display: inline-flex; align-items: center; text-decoration: none; font-size: 15px; }
  .practise a.act.secondary { background: var(--card); color: var(--accent); border: 1px solid var(--accent); }
  footer { max-width: 900px; margin: 0 auto; padding: 8px 16px 32px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--border); }
  .katex-display { overflow-x: auto; overflow-y: hidden; }
  .katex { font-size: 1.05em; }
  @media (max-width: 600px) {
    .line { grid-template-columns: 1fr; }
    .tabs { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; gap: 0; }
    .tabs button { font-size: 14px; padding: 8px 9px; }
    .tabs::-webkit-scrollbar { display: none; }
    .depth .walk { margin-left: 0; }
    .line .codes { text-align: left; }
    .scene-host { min-height: 320px; }
  }
</style>
</head>
<body>
<header>
  <h1><a href="/learn">Learn</a> <span id="subtitle">· one question, read three ways</span></h1>
  <nav><a href="/examiner">Be the examiner</a><a href="/mark">Mark my working</a><a href="/playbooks">Playbooks</a></nav>
</header>
<main id="app"><div class="muted">Loading…</div></main>
<footer id="foot"></footer>
<script>
const app = document.getElementById("app");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
function typeset(el) {
  if (window.renderMathInElement) renderMathInElement(el, {
    delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}],
    throwOnError: false,
  });
}
function plural(n, w) { return `${n} ${w}${n === 1 ? "" : "s"}`; }
function partName(p) { return p.label ? `Part (${p.label})` : "The question"; }
function chips(codes) {
  const list = Array.isArray(codes) ? codes : codes ? [codes] : [];
  return list.length ? list.map(c => `<span class="chip">${esc(c)}</span>`).join("") : `<span class="chip none">no mark</span>`;
}
function setFoot(d) { $("foot").textContent = d.disclaimer || ""; }

// ------------------------------------------------------------------------------------------- catalogue
async function renderCatalogue() {
  document.title = "Learn a question";
  let d;
  try { d = await (await fetch("/api/learn/catalogue")).json(); }
  catch (e) { app.innerHTML = `<div class="warning">Couldn't load the questions (${esc(e.message || e)}). Is the server still running?</div>`; return; }
  setFoot(d);
  app.innerHTML = `<div class="hint">${plural(d.n_items, "question")}, each with a mark scheme, a solution at three depths where available, and the pitfalls that lose marks.
      ${d.n_levels ? `${d.n_levels} with layered solutions.` : ""} ${d.n_scenes ? `${d.n_scenes} with an interactive picture.` : ""}</div>` +
    d.components.map(c => `<h2 class="comp">${esc(c.component)}</h2><div class="grid">` + c.items.map(it => `
      <a class="tile" href="/learn?item=${encodeURIComponent(it.item_id)}">
        <b>${esc(it.title)}</b>
        <span class="meta">${plural(it.marks, "mark")}${it.n_parts > 1 ? ` · ${it.n_parts} parts` : ""}${it.tier ? `<span class="badge tier">${esc(it.tier)}</span>` : ""}
          ${it.has_levels ? `<span class="badge levels">levels</span>` : ""}${it.has_scenes ? `<span class="badge interactive">interactive</span>` : ""}</span>
      </a>`).join("") + `</div>`).join("");
}

// ---------------------------------------------------------------------------------------------- viewer
let view = null, depth = "standard", walk = false;
let walkList = [], walkPos = 0;   // walk-through: flattened lines across parts, and how many are revealed
const sceneState = {};   // scene id -> rendered?
const DEPTHS = ["brisk", "standard", "every_step"];
const PREFS_KEY = "learn.solution.prefs";   // {depth, walk}: remembered for the next item opened
function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem(PREFS_KEY) || "{}");
    if (DEPTHS.includes(p.depth)) depth = p.depth;
    walk = p.walk === true;
  } catch {}
}
function savePrefs() { try { localStorage.setItem(PREFS_KEY, JSON.stringify({depth, walk})); } catch {} }

function questionCard(v) {
  return `<div class="card question"><h3>${esc(v.title)} <small>· ${plural(v.total_marks, "mark")}${v.tier ? ` · ${esc(v.tier)}` : ""}${v.question_type.topic_title ? ` · ${esc(v.question_type.topic_title)}` : ""}</small></h3>
    ${v.stem ? `<div class="pre stem">${esc(v.stem)}</div>` : ""}
    ${v.parts.map(p => `<div class="pre">${p.label ? `<b>(${esc(p.label)})</b> ` : ""}${esc(p.text)} <span class="muted">[${p.marks}]</span></div>`).join("")}
    ${v.question_type.has_playbook ? `<div class="hint" style="margin-top:8px">Question type: <a href="/playbooks?type=${encodeURIComponent(v.question_type.id)}">${esc(v.question_type.title)} playbook</a></div>` : ""}
  </div>`;
}

function hasLevel(v, key) { return v.parts.some(p => p.solution_levels && p.solution_levels[key]); }
function anyBrisk(v) { return hasLevel(v, "brisk"); }
// Which lines a part shows at the chosen depth (falls back to the standard steps when a level is missing).
function partLines(p) {
  const lv = p.solution_levels || {};
  if (depth === "brisk" && lv.brisk) return {mode: "brisk", lines: lv.brisk};
  if (depth === "every_step" && lv.every_step) return {mode: "every_step", lines: lv.every_step};
  return {mode: "standard", lines: p.steps, fallback: depth !== "standard"};
}
function fallbackHint() { return `<div class="hint">No ${depth === "brisk" ? "brisk" : "every-step"} version for this part yet; showing the standard solution.</div>`; }
// One solution line. In walk-through mode the "why" (and its check) sit behind a "Why?" disclosure so the student
// can try to explain the step before reading the reason.
function lineHtml(mode, s, inWalk) {
  if (mode === "brisk") return `<div class="line"><div class="work">${esc(s.working)}</div><div class="codes">${chips(s.secures)}</div></div>`;
  if (mode === "standard") return `<div class="line"><div class="work"><span class="n">${s.step}.</span>${esc(s.working)}</div><div class="codes">${chips(s.mark)}</div></div>`;
  const why = s.why ? `<div class="why">${esc(s.why)}</div>` : "";
  const check = s.check ? `<div class="check"><b>Check:</b> ${esc(s.check)}</div>` : "";
  const detail = inWalk && s.why ? `<details class="whyd"><summary>Why?</summary>${why}${check}</details>` : why + check;
  return `<div class="line"><div class="work"><span class="n">${s.step}.</span>${esc(s.working)}${detail}</div><div class="codes">${chips(s.secures)}</div></div>`;
}
function partHeading(p) { return `<div class="partname"><b>${esc(partName(p))}</b> · ${plural(p.marks, "mark")}</div>`; }
function partExtras(p) {
  let html = "";
  if (p.hints.length) html += `<div class="hints"><b>Hints:</b> ${p.hints.map(esc).join(" ")}</div>`;
  if (p.alternatives.length) html += p.alternatives.map(a => `<div class="hint">${esc(a.name)}: ${a.marks.map(m => `<b>${esc(m.code)}</b> ${esc(m.for)}`).join("; ")}</div>`).join("");
  return html;
}
function walkActive() { return walk && depth !== "brisk"; }

function solutionPanel(v) {
  const btn = (key, label, ok) => `<button data-depth="${key}" class="${depth === key ? "on" : ""}" ${ok ? "" : "disabled"}>${label}${ok ? "" : " <small>· coming soon</small>"}</button>`;
  const canWalk = depth !== "brisk";
  let html = `<div class="depth">${btn("brisk", "Brisk: what you'd write", anyBrisk(v))}${btn("standard", "Standard", true)}${btn("every_step", "Every step", hasLevel(v, "every_step"))}
    <label class="walk ${canWalk ? "" : "off"}" title="${canWalk ? "Reveal the solution one line at a time" : "Nothing to hide in the brisk version"}">
      <input type="checkbox" id="walk-toggle" ${walk && canWalk ? "checked" : ""} ${canWalk ? "" : "disabled"}> Walk me through it</label></div>`;
  if (walkActive()) {
    // Flatten every part's lines into one sequence; parts are revealed in turn, each with its heading when it starts.
    walkList = [];
    v.parts.forEach((p, pi) => {
      const {mode, lines, fallback} = partLines(p);
      const pre = partHeading(p) + (fallback ? fallbackHint() : "") + (lines.length ? "" : `<div class="hint">No worked solution stored for this part.</div>`);
      lines.forEach((s, i) => walkList.push({
        pre: i === 0 ? pre : "", html: lineHtml(mode, s, true), post: i === lines.length - 1 ? partExtras(p) : "",
      }));
      if (!lines.length && walkList.length) walkList[walkList.length - 1].post += pre + partExtras(p);   // empty part: attach to the previous line
    });
    html += `<div id="walk-lines"></div>
      <div class="walkbar" id="walk-bar">
        <span class="progress" id="walk-progress" aria-live="polite"></span>
        <button id="walk-next" class="primary">Next line</button>
        <button id="walk-all">Show all</button>
        <button id="walk-restart">Start again</button>
        <span class="keys">Tip: press → or n for the next line.</span>
      </div><div id="walk-done"></div>`;
    return html;
  }
  for (const p of v.parts) {
    const {mode, lines, fallback} = partLines(p);
    html += partHeading(p) + (fallback ? fallbackHint() : "");
    html += lines.length ? lines.map(s => lineHtml(mode, s, false)).join("") : `<div class="hint">No worked solution stored for this part.</div>`;
    html += partExtras(p);
  }
  return html;
}

// Reveal lines walkPos..target-1, appending each to the panel (so open "Why?" disclosures are kept) and typesetting it.
function walkReveal(target, scroll) {
  const box = $("walk-lines");
  if (!box) return;
  const n = walkList.length;
  target = Math.max(0, Math.min(target, n));
  let lastLine = null;
  box.querySelectorAll(".line.fresh").forEach(el => el.classList.remove("fresh"));
  while (walkPos < target) {
    const item = walkList[walkPos++];
    const frag = document.createElement("div");
    frag.innerHTML = item.pre + item.html + item.post;
    typeset(frag);
    const line = frag.querySelector(".line");
    if (line) lastLine = line;
    while (frag.firstChild) box.appendChild(frag.firstChild);
  }
  if (lastLine && scroll) { lastLine.classList.add("fresh"); lastLine.scrollIntoView({behavior: "smooth", block: "center"}); }
  const done = walkPos >= n;
  $("walk-progress").textContent = n ? `Line ${walkPos} of ${n}` : "No lines to show";
  $("walk-next").hidden = done;
  $("walk-all").hidden = done;
  $("walk-done").innerHTML = done && n ? `<div class="hints done"><span>You've seen every step. Try the brisk version to see what you'd actually write in the exam.</span>
      ${anyBrisk(view) ? `<button id="walk-brisk">Show the brisk version</button>` : ""}</div>` : "";
  const brisk = $("walk-brisk");
  if (brisk) brisk.onclick = () => setDepth("brisk");
}
function walkNext() { if (walkActive() && $("walk-lines")) walkReveal(walkPos + 1, true); }
function setDepth(key) { depth = key; savePrefs(); walkPos = 0; renderPanel("solution"); }
function wireSolution(el) {
  el.querySelectorAll(".depth button").forEach(b => b.onclick = () => setDepth(b.dataset.depth));
  const toggle = $("walk-toggle");
  if (toggle) toggle.onchange = () => { walk = toggle.checked; savePrefs(); walkPos = 0; renderPanel("solution"); };
  if (!walkActive()) return;
  const keep = walkPos;   // coming back to the tab keeps the place reached; a fresh render starts at line 1
  walkPos = 0;
  walkReveal(Math.max(1, keep), false);
  $("walk-next").onclick = walkNext;
  $("walk-all").onclick = () => walkReveal(walkList.length, false);
  $("walk-restart").onclick = () => { walkPos = 0; renderPanel("solution"); $("walk-lines").scrollIntoView({behavior: "smooth", block: "start"}); };
}
// Keyboard: → or n reveals the next line while the Solution tab is showing (never when typing in a field).
document.addEventListener("keydown", e => {
  if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
  const t = e.target;
  if (t && t.matches && t.matches("input, textarea, select, [contenteditable], [contenteditable] *")) return;
  if (!view || !walkActive()) return;
  const panel = $("panel-solution");
  if (!panel || !panel.classList.contains("on")) return;
  if (e.key === "ArrowRight" || e.key === "n" || e.key === "N") { e.preventDefault(); walkNext(); }
});

const APPROACH_WORDS = {
  "graphical": "The picture is the argument: you can see why the result is true.",
  "algebraic-check": "The picture checks the algebra: what you calculate should match what you see.",
  "model": "An interactive model of the situation in the question.",
};
function graphicalPanel(v) {
  if (!v.scenes.length) return `<div class="hint">No interactive scene for this question yet.</div>`;
  return (v.approach ? `<div class="hint">Approach: ${esc(v.approach)}</div>` : "") + v.scenes.map((s, i) => `
    <div class="scene card" data-i="${i}">
      <h4>${esc(s.title || `Scene ${i + 1}`)}${s.part ? ` <small class="muted">· part (${esc(s.part)})</small>` : ""}</h4>
      ${s.purpose ? `<div class="purpose">${esc(s.purpose)}</div>` : ""}
      ${APPROACH_WORDS[s.approach] ? `<div class="approach">${esc(APPROACH_WORDS[s.approach])}</div>` : ""}
      <div id="scene-${i}" class="scene-host"></div>
      <div class="scene-note">Scenes are checked automatically; tell us if something looks wrong.</div>
    </div>`).join("");
}

function schemePanel(v) {
  return v.parts.map(p => `<div class="partname"><b>${esc(partName(p))}</b> · ${plural(p.marks, "mark")}</div>` +
    (p.mark_scheme.length ? p.mark_scheme.map(m => `<div class="row"><span class="chip">${esc(m.code)}</span>
      <div class="for"><div class="scheme">${esc(m.for)}</div>${m.notes ? `<div class="notes">${esc(m.notes)}</div>` : ""}
      ${m.convention_short ? `<div class="conv"><b>${esc(m.code)}:</b> ${esc(m.convention_short)}</div>` : ""}</div></div>`).join("")
                         : `<div class="hint">No scheme lines stored.</div>`)).join("");
}

function pitfallsPanel(v) {
  const all = v.parts.flatMap(p => p.pitfalls.map(x => ({...x, part: p})));
  if (!all.length) return `<div class="hint">No pitfalls recorded for this question.</div>`;
  return all.map(x => `<div class="pit">${x.error_code ? `<span class="chip err">${esc(x.error_code)}</span>` : ""}
      ${v.parts.length > 1 ? `<span class="muted" style="font-size:13px">${esc(partName(x.part))}</span>` : ""}
      <div style="margin-top:6px">${esc(x.text)}</div>
      ${x.definition ? `<div class="def">${esc(x.definition)}</div>` : ""}</div>`).join("");
}

function renderPanel(name) {
  const el = $("panel-" + name);
  if (!el) return;
  if (name === "solution") el.innerHTML = solutionPanel(view);
  else if (name === "graphical") { if (!el.dataset.built) { el.innerHTML = graphicalPanel(view); el.dataset.built = "1"; } }
  else if (name === "scheme") el.innerHTML = schemePanel(view);
  else if (name === "pitfalls") el.innerHTML = pitfallsPanel(view);
  typeset(el);
  if (name === "solution") wireSolution(el);
}

function showTab(name) {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === "panel-" + name));
  renderPanel(name);
  try { history.replaceState(null, "", `/learn?item=${encodeURIComponent(view.item_id)}&tab=${name}`); } catch {}
  if (name === "graphical") setTimeout(renderScenes, 50);   // never while hidden (JSXGraph needs a laid-out box)
}

function renderScenes() {
  view.scenes.forEach((scene, i) => {
    if (sceneState[i]) return;
    const box = $("scene-" + i);
    if (!box || box.offsetParent === null) return;
    sceneState[i] = true;
    const opts = {theme: "auto", showTitle: false };
    try {
      if (typeof renderSceneWhenVisible === "function") renderSceneWhenVisible("scene-" + i, scene, opts);
      else if (typeof renderScene === "function") renderScene("scene-" + i, scene, opts);
      else box.innerHTML = `<div class="warning" style="margin:0">The scene renderer (/static/scene.js) is not available yet, so this picture cannot be drawn.</div>`;
    } catch (e) {
      box.innerHTML = `<div class="warning" style="margin:0">This scene could not be drawn (${esc(e.message || e)}).</div>`;
    }
  });
}

async function renderViewer(itemId, tab) {
  let v;
  try {
    const r = await fetch(`/api/learn/item?id=${encodeURIComponent(itemId)}`);
    v = await r.json();
    if (!r.ok) throw new Error(v.error || r.statusText);
  } catch (e) {
    app.innerHTML = `<div class="warning">Couldn't load this question (${esc(e.message || e)}). <a href="/learn">Back to all questions</a></div>`; return;
  }
  view = v; setFoot(v);
  loadPrefs(); walkPos = 0;   // remembered depth and walk-through choice apply to each item opened
  document.title = `Learn · ${v.title}`;
  $("subtitle").textContent = `· ${v.title}`;
  const tabs = [["solution", "Solution"], ["graphical", `Graphical${v.scenes.length ? ` (${v.scenes.length})` : ""}`], ["scheme", "Mark scheme"], ["pitfalls", "Pitfalls"]];
  app.innerHTML = `<div class="hint"><a class="back" href="/learn">← All questions</a></div>` + questionCard(v) +
    `<div class="tabs">${tabs.map(([k, t]) => `<button data-tab="${k}">${t}</button>`).join("")}</div>` +
    tabs.map(([k]) => `<div class="panel card" id="panel-${k}"></div>`).join("") +
    `<div class="card"><h3>Practise</h3><div class="practise">
       <a class="act" href="/mark?item=${encodeURIComponent(v.item_id)}">Mark my working on this question</a>
       <a class="act secondary" href="/examiner">Be the examiner</a>
       ${v.question_type.has_playbook ? `<a class="act secondary" href="/playbooks?type=${encodeURIComponent(v.question_type.id)}">Playbook: ${esc(v.question_type.title)}</a>` : ""}
     </div>${v.skills.length ? `<div class="hint" style="margin-top:10px">Skills: ${v.skills.map(s => `<span class="chip skill">${esc(s.title)}</span>`).join("")}</div>` : ""}</div>`;
  typeset(app.querySelector(".question"));
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => showTab(b.dataset.tab));
  showTab(tabs.some(([k]) => k === tab) ? tab : "solution");
}

const params = new URLSearchParams(location.search);
window.addEventListener("DOMContentLoaded", () => {
  const item = params.get("item");
  if (item) renderViewer(item, params.get("tab")); else renderCatalogue();
});
</script>
</body>
</html>
